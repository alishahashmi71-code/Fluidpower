<!-- ========================================
     FLUID POWER LANDING PAGE

     PASTE INTO: HubSpot Page Settings → Advanced → Header HTML

     IMPORTANT — HOW THIS PAGE WORKS:
     HubSpot strips <style> blocks out of individual Custom HTML modules, so any
     :hover, @keyframes, or @media rule placed inside a module will NOT apply.
     This Header HTML is the ONE reliable place for that CSS, so ALL hover states,
     animations, the image rotator, and every responsive breakpoint live here.
     Module files keep their layout inline (so the page still reads if this is
     ever cleared) and reference the class names defined below.
     ======================================== -->

<style>
  /* ── Base ─────────────────────────────────────────── */
  .applied-landing-page * { box-sizing: border-box; }

    font-family: "din-2014", "DIN 2014", "DIN Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    line-height: 1.6;

  /* ── Keyframes ────────────────────────────────────── */
  @keyframes appliedFadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes appliedSlideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes appliedSlideLeft { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }

  /* ── Module 2: image rotator (4 slides × 4s = 16s loop, no gap) ── */
  @keyframes afpRotatorFade {
    0%   { opacity: 0; }
    2%   { opacity: 1; }
    22%  { opacity: 1; }
    25%  { opacity: 0; }
    100% { opacity: 0; }
  }
  .afp-rw-slide { animation: afpRotatorFade 16s linear infinite; }
  .afp-rw-slide:nth-child(1) { animation-delay: 0s; }
  .afp-rw-slide:nth-child(2) { animation-delay: 4s; }
  .afp-rw-slide:nth-child(3) { animation-delay: 8s; }
  .afp-rw-slide:nth-child(4) { animation-delay: 12s; }

  .afp-em-tile  { transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; }
  .afp-em-tile:hover  { transform: translateY(-6px); border-color: #007b85; box-shadow: 0 14px 32px rgba(0,0,0,0.10); }

  .afp-wa-row   { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }

  .afp-fc-card  { transition: transform 0.3s ease, box-shadow 0.3s ease; }
  .afp-fc-card:hover  { transform: translateY(-6px); box-shadow: 0 16px 36px rgba(0,0,0,0.10); }

  .afp-fp-card  { transition: transform 0.35s ease, box-shadow 0.35s ease; }
  .afp-fp-card:hover  { transform: translateY(-8px); box-shadow: 0 28px 64px rgba(0,0,0,0.22); }
  .afp-fp-img   { transition: transform 0.6s ease; }

  .afp-cap-cta-btn:hover { background: #005662; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,123,133,0.40); }

  .afp-fp-cta { transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease; }
  .afp-fp-cta:hover { background: #005662; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,123,133,0.40); }

  .afp-vid-btn:hover { background: #1E2F5C; color: #ffffff; transform: scale(1.1); }

  .afp-vid-carousel::-webkit-scrollbar-thumb { background: #007b85; border-radius: 10px; }
